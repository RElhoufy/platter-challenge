<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platter Challenge</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN with config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config/tailwind.config.js"></script>
  </head>
  <body class="min-h-screen">
    <div class="container mx-auto px-4 py-4">
      <h2
        class="text-center text-[28px] font-serif font-bold tracking-[-0.01em] text-neutral-black mb-6"
      >
        Best Sellers
      </h2>
      <div id="product-grid">
        <div id="product-cards-container" class="grid grid-cols-2 gap-x-[11px] gap-y-[12px]">
          <div class="product-card-skeleton">
            <div class="product-card__image-skeleton"></div>
            <div class="product-card__title-skeleton"></div>
            <div class="product-card__reviews-skeleton"></div>
            <div class="product-card__price-skeleton"></div>
          </div>
          <div class="product-card-skeleton">
            <div class="product-card__image-skeleton"></div>
            <div class="product-card__title-skeleton"></div>
            <div class="product-card__reviews-skeleton"></div>
            <div class="product-card__price-skeleton"></div>
          </div>
          <div class="product-card-skeleton">
            <div class="product-card__image-skeleton"></div>
            <div class="product-card__title-skeleton"></div>
            <div class="product-card__reviews-skeleton"></div>
            <div class="product-card__price-skeleton"></div>
          </div>
          <div class="product-card-skeleton">
            <div class="product-card__image-skeleton"></div>
            <div class="product-card__title-skeleton"></div>
            <div class="product-card__reviews-skeleton"></div>
            <div class="product-card__price-skeleton"></div>
          </div>
        </div>
        <button
          class="w-full py-4 mt-[12px] text-center font-poppins font-semibold leading-[140%] text-white bg-black rounded-[100px] hidden"
          id="show-more-button"
        >
          Show More
        </button>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
